<nav class="bg-neutral-primary w-full border-b border-default fixed top-0 z-50">
  <div class="max-w-screen-xl flex flex-wrap items-center justify-between mx-auto p-4">
    <a routerLink="/feeds" class="flex items-center space-x-3 rtl:space-x-reverse">
      <img src="./Images/route.png" class="h-9 rounded-md" alt="Flowbite Logo" />
      <span class="self-center text-xl text-heading font-semibold whitespace-nowrap">
        Route Social
      </span>
    </a>

    @if (flag()) {
      <div class="flex items-center md:order-2 space-x-3 md:space-x-0 rtl:space-x-reverse">
        <button
          type="button"
          class="flex text-sm bg-neutral-primary rounded-full md:me-0 focus:ring-4 focus:ring-neutral-tertiary"
          id="user-menu-button"
          aria-expanded="false"
          data-dropdown-toggle="user-dropdown"
          data-dropdown-placement="bottom"
        >
          <span class="sr-only">Open user menu</span>
          <span>{{ userName() }}</span>
          <img class="w-8 h-8 rounded-full" [src]="userImage()" alt="user photo" />
        </button>
        <!-- Dropdown menu -->
        <div
          class="z-50 hidden bg-neutral-primary-medium border border-default-medium rounded-base shadow-lg w-44"
          id="user-dropdown"
        >
          <ul class="p-2 text-sm text-body font-medium" aria-labelledby="user-menu-button">
            <li>
              <a
                routerLink="profile"
                class="inline-flex items-center w-full p-2 hover:bg-neutral-tertiary-medium hover:text-heading rounded"
                ><i class="fa-regular fa-user mr-1"></i>Profile</a
              >
            </li>
            <li>
              <a
                routerLink="settings"
                class="inline-flex items-center w-full p-2 hover:bg-neutral-tertiary-medium hover:text-heading rounded"
                ><i class="fa-solid fa-gear mr-1"></i>Settings</a
              >
            </li>
            <hr class="border-gray-600" />
            <li>
              <a
                (click)="logOut()"
                class="cursor-pointer text-rose-500 inline-flex items-center w-full p-2 hover:bg-neutral-tertiary-medium hover:text-rose-300 rounded"
                ><i class="fa-solid fa-arrow-right-to-bracket mr-1"></i>Sign out</a
              >
            </li>
          </ul>
        </div>
        <button
          data-collapse-toggle="navbar-user"
          type="button"
          class="inline-flex items-center p-2 w-10 h-10 justify-center text-sm text-body rounded-base md:hidden hover:bg-neutral-secondary-soft hover:text-heading focus:outline-none focus:ring-2 focus:ring-neutral-tertiary"
          aria-controls="navbar-user"
          aria-expanded="false"
        >
          <span class="sr-only">Open main menu</span>
          <svg
            class="w-6 h-6"
            aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            fill="none"
            viewBox="0 0 24 24"
          >
            <path
              stroke="currentColor"
              stroke-linecap="round"
              stroke-width="2"
              d="M5 7h14M5 12h14M5 17h14"
            />
          </svg>
        </button>
      </div>

      <div
        class="items-center justify-between hidden w-full md:flex md:w-auto md:order-1"
        id="navbar-user"
      >
        <ul
          class="font-medium flex flex-col mt-4 bg-slate-100/80 p-2 rounded-base md:flex-row md:space-x-8 rtl:space-x-reverse md:mt-0"
        >
          <li>
            <a
              routerLinkActive="bg-white text-mainColor font-bold"
              routerLink="/feeds"
              class="block p-3 text-heading rounded md:dark:hover:bg-transparent"
            >
              <i class="fa-regular fa-house text-xl"></i> Feeds</a
            >
          </li>
          <li>
            <a
              routerLinkActive="bg-white text-mainColor font-bold"
              routerLink="/profile"
              class="block p-3 text-heading rounded md:dark:hover:bg-transparent"
            >
              <i class="fa-regular fa-user text-xl"></i> Profile</a
            >
          </li>
          <li>
            <a
              routerLinkActive="bg-white text-mainColor font-bold"
              routerLink="/notifications"
              class="block p-3 text-heading rounded md:dark:hover:bg-transparent"
            >
              <span class="relative inline-block">
                <i class="fa-regular fa-bell text-xl"></i>
                <!-- Notification Badge -->
                @if (notificationCount() > 0) {
                  <span
                    class="absolute -top-3 -right-1 bg-red-500 text-white rounded-full px-1 text-sm font-bold flex items-center justify-center"
                  >
                    {{ notificationCount() }}
                  </span>
                }
              </span>
              Notifications</a
            >
          </li>
        </ul>
      </div>
    }
  </div>
</nav>
