<!-- Navbar (Matching Image 2) -->
<app-navbar [flag]="isLoggedIn()"></app-navbar>

<!-- 404 Main Container -->
<main class="min-h-screen bg-[#f8fafc] flex flex-col items-center justify-center px-4 py-16 pt-28 sm:pt-32 text-center">
  <div class="w-full max-w-xl mx-auto flex flex-col items-center">
    <!-- Illustration -->
    <div class="relative w-full max-w-[420px] sm:max-w-[500px] mb-8 select-none">
      <img
        src="./Images/404 not found.png"
        alt="404 Page Not Found"
        class="w-full h-auto object-contain mx-auto"
        loading="eager"
      />
    </div>

    <!-- Title -->
    <h1 class="text-3xl sm:text-4xl md:text-5xl font-black text-[#0f172a] tracking-tight">
      Page not found
    </h1>

    <!-- Subtitle -->
    <p class="mt-3 text-sm sm:text-base text-slate-500 max-w-md mx-auto leading-relaxed">
      The page you're looking for doesn't exist or may have been moved.
    </p>

    <!-- Action Buttons -->
    <div class="mt-8 flex flex-col sm:flex-row items-center justify-center gap-3 w-full max-w-xs sm:max-w-md">
      <!-- Back to Feed Button -->
      <a
        routerLink="/feeds"
        class="w-full sm:w-auto inline-flex items-center justify-center gap-2 rounded-xl bg-[#2563eb] hover:bg-[#1d4ed8] px-6 py-3 text-sm sm:text-base font-semibold text-white shadow-sm transition-all duration-150 active:scale-[0.98]"
      >
        <svg
          class="size-5"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        Back to Feed
      </a>

      <!-- Go to Profile Button -->
      <a
        routerLink="/profile"
        class="w-full sm:w-auto inline-flex items-center justify-center gap-2 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 px-6 py-3 text-sm sm:text-base font-semibold text-slate-700 shadow-sm transition-all duration-150 active:scale-[0.98]"
      >
        <svg
          class="size-5"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        Go to Profile
      </a>
    </div>
  </div>
</main>
