<section class="flex flex-col gap-4 rounded-2xl bg-white p-4 shadow-sm">
  <form (submit)="createPost($event)">
    <!-- User + visibility -->
    <div class="flex items-center gap-3">
      <span class="relative size-11 shrink-0 overflow-hidden rounded-full bg-slate-200">
        <img
          [src]="user.photo || 'assets/avatar.png'"
          [alt]="user.name"
          class="absolute inset-0 size-full object-cover"
          height="150px"
        />
      </span>
      <div class="flex flex-col gap-1.5">
        <h2 class="text-base font-bold leading-tight">{{ user.name }}</h2>
        <div class="relative flex w-fit items-center">
          <span class="pointer-events-none absolute left-3 text-slate-600"
            ><svg
              class="size-4"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="9" />
              <path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18" /></svg
          ></span>
          <select
            [formControl]="postPrivacy"
            aria-label="Post visibility"
            class="appearance-none rounded-xl border border-slate-200 bg-slate-50 py-1.5 pl-9 pr-8 text-sm font-medium text-slate-700 outline-none focus:border-mainColor"
          >
            <option value="public">Public</option>
            <option value="following">Friends</option>
            <option value="only_me">Only me</option>
          </select>
          <span class="pointer-events-none absolute right-2.5 text-slate-500"
            ><svg
              class="size-4"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="m6 9 6 6 6-6" /></svg
          ></span>
        </div>
      </div>
    </div>

    <!-- Text -->
    <textarea
      [formControl]="postBody"
      rows="4"
      placeholder="Enter Your Post Body"
      class="min-h-28 w-full resize-y rounded-2xl border border-slate-200 bg-slate-50 p-4 text-sm outline-none transition placeholder:text-slate-400 focus:border-mainColor focus:bg-white focus:ring-4 focus:ring-mainColor/10 sm:text-base"
    ></textarea>

    @if (imgURL()) {
      <div class="file-reader">
        <img [src]="imgURL()" alt="" />
      </div>
    }

    <!-- Actions -->
    <div class="flex items-center justify-between gap-3 border-t border-slate-200 pt-3">
      <div class="flex items-center gap-1">
        <label
          class="flex size-9 cursor-pointer items-center justify-center rounded-full text-emerald-600 hover:bg-emerald-50"
          aria-label="Add image"
        >
          <svg
            class="size-5"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="3" y="4" width="18" height="16" rx="2" />
            <circle cx="9" cy="10" r="1.5" />
            <path d="m21 16-5-5-9 9" />
          </svg>
          <input (change)="holdImg($event)" type="file" accept="image/*" class="sr-only" />
        </label>
        <button
          type="button"
          aria-label="Add emoji"
          class="flex size-9 items-center justify-center rounded-full text-amber-500 hover:bg-amber-50"
        >
          <svg
            class="size-5"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="9" />
            <path d="M8.5 14a4.5 4.5 0 0 0 7 0M9 9.5h.01M15 9.5h.01" />
          </svg>
        </button>
      </div>

      <!-- Disabled look (remove "disabled" when there is content) -->
      <button
        type="submit"
        class="flex items-center justify-center gap-2 rounded-xl bg-mainColor px-6 py-2.5 text-sm font-semibold text-white transition hover:bg-blue-700 disabled:cursor-not-allowed disabled:opacity-60 disabled:hover:bg-mainColor"
      >
        Post
        <svg
          class="size-4"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M21 3 10 14M21 3l-7 18-4-7-7-4z" />
        </svg>
      </button>
    </div>
  </form>
</section>
