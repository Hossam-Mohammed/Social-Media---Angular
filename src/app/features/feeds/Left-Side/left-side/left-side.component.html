<aside class="flex flex-wrap gap-2 rounded-2xl bg-white p-2 shadow-sm lg:flex-col lg:p-3">
  <button
    type="button"
    aria-current="page"
    (click)="_PostService.selectPostType('feed')"
    class="flex basis-[calc(50%-0.25rem)] items-center justify-center gap-2 rounded-xl bg-blue-50 px-4 py-3 text-sm font-semibold text-slate-700 hover:bg-slate-100 lg:basis-full lg:justify-start"
    [class]="
      _PostService.postType() === 'feed'
        ? '!text-mainColor bg-blue-50'
        : '!text-slate-700 bg-slate-50'
    "
  >
    <svg
      class="size-5"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M4 5h13a2 2 0 0 1 2 2v12H6a2 2 0 0 1-2-2z" />
      <path d="M8 9h7M8 13h7M19 9h1a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1" />
    </svg>
    Feed
  </button>

  <button
    type="button"
    (click)="_PostService.selectPostType('my-posts')"
    class="flex basis-[calc(50%-0.25rem)] items-center justify-center gap-2 rounded-xl bg-slate-50 px-4 py-3 text-sm font-semibold text-slate-700 hover:bg-slate-100 lg:basis-full lg:justify-start"
    [class]="
      _PostService.postType() === 'my-posts'
        ? '!text-mainColor bg-blue-50'
        : '!text-slate-700 bg-slate-50'
    "
  >
    <svg
      class="size-5"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path
        d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"
      />
    </svg>
    My Posts
  </button>

  <button
    type="button"
    (click)="_PostService.selectPostType('')"
    class="flex basis-[calc(50%-0.25rem)] items-center justify-center gap-2 rounded-xl bg-slate-50 px-4 py-3 text-sm font-semibold text-slate-700 hover:bg-slate-100 lg:basis-full lg:justify-start"
    [class]="
      _PostService.postType() === '' ? '!text-mainColor bg-blue-50' : '!text-slate-700 bg-slate-50'
    "
  >
    <svg
      class="size-5"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <circle cx="12" cy="12" r="9" />
      <path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18" />
    </svg>
    Community
  </button>

  <button
    type="button"
    (click)="_PostService.selectPostType('saved')"
    class="flex basis-[calc(50%-0.25rem)] items-center justify-center gap-2 rounded-xl bg-slate-50 px-4 py-3 text-sm font-semibold text-slate-700 hover:bg-slate-100 lg:basis-full lg:justify-start"
    [class]="
      _PostService.postType() === 'saved'
        ? '!text-mainColor bg-blue-50'
        : '!text-slate-700 bg-slate-50'
    "
  >
    <svg
      class="size-5"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z" />
    </svg>
    Saved
  </button>
</aside>
